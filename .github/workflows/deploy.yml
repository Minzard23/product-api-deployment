name: Student API test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: student-api-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint --if-present

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          umask 077
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/classroom_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy and verify API and database
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          [[ "$VPS_HOST" == "103.160.62.220" ]]
          [[ "$VPS_USER" =~ ^student(0[1-9]|1[0-5])$ ]]
          student_number="${VPS_USER#student}"
          expected_port="$((8001 + 10#$student_number))"
          [[ "$VPS_PORT" == "$expected_port" ]]
          [[ "$VPS_PATH" == "/home/$VPS_USER/product-api-deployment" ]]
          ssh -i ~/.ssh/classroom_key -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" bash -se -- "$VPS_PATH" "$VPS_PORT" <<'REMOTE'
          set -euo pipefail
          cd "$1"
          test -f .env
          test -f docker-compose.override.yml
          systemctl --user start docker
          git pull --ff-only origin main
          docker compose up --build -d
          for attempt in $(seq 1 60); do
            if curl --fail --silent --max-time 5 "http://127.0.0.1:$2/health" >/dev/null \
              && curl --fail --silent --max-time 5 "http://127.0.0.1:$2/api/products" >/dev/null; then
              echo 'API and database checks passed'
              exit 0
            fi
            sleep 2
          done
          echo 'API/database readiness failed; inspect the student container logs over SSH.' >&2
          exit 1
          REMOTE

      - name: Remove runner SSH key
        if: always()
        run: rm -f ~/.ssh/classroom_key
